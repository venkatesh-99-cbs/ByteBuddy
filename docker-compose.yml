services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./instance:/app/instance
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
